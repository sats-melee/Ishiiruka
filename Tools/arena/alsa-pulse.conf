# Process-local ALSA routing for the Rust music player inside the build container.
# Keep the distribution's devices/plugins, but use the host PulseAudio/PipeWire
# server instead of trying to open a hardware ALSA device from the container.
</usr/share/alsa/alsa.conf>

pcm.!default {
    type pulse
}

ctl.!default {
    type pulse
}
