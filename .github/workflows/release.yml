name: Upload Latest Artifacts to Release

on:
  release:
    types: [released]

jobs:
  wait-for-builds:
    name: Wait for all builds to complete
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: ["Ubuntu Arena", "Windows Netplay", "Windows Playback", "macOS Netplay", "macOS Playback"]
    steps:
      - name: Wait for build job - ${{ matrix.check }}
        uses: lewagon/wait-on-check-action@v1.7.0
        with:
          ref: ${{ github.event.release.target_commitish }}
          check-name: ${{ matrix.check }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

  package:
    name: Release Sats Arena Dolphin
    runs-on: ubuntu-latest
    needs: wait-for-builds
    steps:
      - name: Download latest artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: pr-build.yml
          commit: ${{ github.event.release.target_commitish }}
      - name: Organize release files
        run: |
          find ./ -mindepth 2 -type f -exec mv -t ./ -i '{}' +
          find . -type d -empty -delete
          ls -la
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
