name: Builds

on:
  push:
    branches:
        - "**"
  pull_request:
    branches:
      - slippi

jobs:

  skip_duplicates:
    name: Skip Duplicate Runs
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          concurrent_skipping: "same_content"
          do_not_skip: '["push", "workflow_dispatch", "schedule"]'

  # goal is to prevent merges when the commit is not from the main branch, builds should still succeed
  check_rust_commit:
    needs: [skip_duplicates]
    if: ${{ needs.skip_duplicates.outputs.should_skip != 'true' }}
    name: Verify SlippiRustExtensions Commit is in Main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: Ishiiruka
      - name: Main Branch Check
        shell: bash
        run: |
          cd Ishiiruka
          git submodule update --init Externals/SlippiRustExtensions
          cd Externals/SlippiRustExtensions
          commit_id=$(git rev-parse HEAD)
          git branch --contains $commit_id | grep main

  windows:
    needs: [skip_duplicates]
    if: ${{ needs.skip_duplicates.outputs.should_skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Netplay, Playback]
        include:
          - build_type: Netplay
            artifact_name: windows-netplay
            build_config: Release
          - build_type: Playback
            artifact_name: windows-playback
            build_config: ReleasePlayback
    env:
      DXSDK_DIR: "C:\\Program Files (x86)\\Microsoft DirectX SDK (June 2010)\\"
    name: "Windows ${{ matrix.build_type }}"
    runs-on: windows-2022
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
        with:
          submodules: recursive
          path: Ishiiruka
      - name: "Checkout sats-arena"
        uses: actions/checkout@v3
        with:
          repository: sats-melee/sats-arena
          path: sats-arena
      - id: rust_ver
        name: Grab Rust Version
        shell: bash
        run: echo "rust_ver=$(sed -rn 's/^channel = "(.*)"/\1/p' ./Ishiiruka/Externals/SlippiRustExtensions/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: "Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust_ver.outputs.rust_ver }}  # Pin to our specific Rust version.
          rustflags: ""  # Disable default injection of warnings = errors.
      - name: "(SlippiRustExtensions) Run cargo test"
        run: cargo test --all --all-features --manifest-path=Ishiiruka/Externals/SlippiRustExtensions/Cargo.toml
      - name: "(sats-arena) Build local host library"
        run: cargo build --release --target x86_64-pc-windows-msvc -p sats-arena-local --manifest-path=sats-arena/Cargo.toml
      - name: "Remove Redistributable"
        shell: cmd
        run: |
          MsiExec.exe /passive /X{F0C3E5D1-1ADE-321E-8167-68EF0DE699A5}
          MsiExec.exe /passive /X{1D8E6291-B0D5-35EC-8441-6616F567A0F7}
          mkdir .\Tools\DX
      - name: "Setup MSBuild"
        uses: microsoft/setup-msbuild@v1
      - name: "Install DirectX SDK Redist"
        shell: powershell
        run: |
          choco install directx-sdk
      - name: 'Fetch Git Tags'
        shell: bash
        if: success()
        working-directory: ${{ github.workspace }}/Ishiiruka
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Build ${{ matrix.build_type }} Dolphin"
        shell: cmd
        run: |
          msbuild /p:Configuration=${{ matrix.build_config }} /p:Platform=x64 ${{ github.workspace }}\Ishiiruka\Source\Dolphin.sln
      - name: "Prepare ${{ matrix.build_type }} Artifact"
        working-directory: ${{ github.workspace }}/Ishiiruka
        run: |
          Xcopy /Y /E /I .\Data\Sys .\Binary\x64\Sys
          cd .\Binary\x64\
          fsutil file createnew FIX-VCRUNTIME140-ERROR.txt 0
          echo "Download and install this: https://aka.ms/vs/16/release/vc_redist.x64.exe" > .\FIX-VCRUNTIME140-ERROR.txt
      - name: "Add Playback codes"
        working-directory: ${{ github.workspace }}/Ishiiruka
        if: matrix.build_type == 'Playback'
        run: |
          Xcopy /Y /E /I .\Data\Sys .\Binary\x64\Sys
          Xcopy /Y /E /I .\Data\PlaybackGeckoCodes\* .\Binary\x64\Sys\GameSettings\
      - name: "Package ${{ matrix.build_type }} Dolphin"
        working-directory: ${{ github.workspace }}/Ishiiruka
        run: |
          $FILE_NAME="${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-${{ matrix.artifact_name }}.zip"
          mkdir artifact
          cd .\Binary\x64\
          attrib +r Sys\*.* /s
          fsutil file createnew portable.txt 0
          7z a $FILE_NAME .\*
          move $FILE_NAME ..\..\artifact\
      - name: "Publish"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "./Ishiiruka/artifact/"

  linux:
    needs: [skip_duplicates]
    if: ${{ needs.skip_duplicates.outputs.should_skip != 'true' }}
    name: "Ubuntu Arena"
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
        with:
          submodules: recursive
          path: Ishiiruka
      - name: "Checkout sats-arena"
        uses: actions/checkout@v3
        with:
          repository: sats-melee/sats-arena
          path: sats-arena
      - name: 'Fetch Git Tags'
        if: success()
        working-directory: ${{ github.workspace }}/Ishiiruka
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Install prerequisites"
        if: success()
        shell: bash
        run: |
          sudo dpkg --add-architecture amd64
          sudo apt update
          sudo apt install \
          cmake \
          ninja-build \
          pkg-config \
          git \
          wget \
          zip \
          libao-dev \
          libasound2-dev \
          libavcodec-dev \
          libavformat-dev \
          libbluetooth-dev \
          libenet-dev \
          libgtk2.0-dev \
          liblzo2-dev \
          libminiupnpc-dev \
          libopenal-dev \
          libpulse-dev \
          libreadline-dev \
          libsfml-dev \
          libsoil-dev \
          libsoundtouch-dev \
          libswscale-dev \
          libusb-1.0-0-dev \
          libwebkit2gtk-4.0-dev \
          libxext-dev \
          libxrandr-dev \
          portaudio19-dev \
          zlib1g-dev \
          libudev-dev \
          libevdev-dev \
          libmbedtls-dev \
          libcurl4-openssl-dev \
          libegl1-mesa-dev \
          libpng-dev \
          qtbase5-private-dev \
          libxxf86vm-dev \
          x11proto-xinerama-dev \
          libfuse2
      - id: rust_ver
        name: Grab Rust Version
        shell: bash
        run: echo "rust_ver=$(sed -rn 's/^channel = "(.*)"/\1/p' ./Ishiiruka/Externals/SlippiRustExtensions/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: "Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust_ver.outputs.rust_ver }}  # Pin to our specific Rust version.
          rustflags: ""  # Disable default injection of warnings = errors.
      - name: "(SlippiRustExtensions) Run cargo test"
        run: cargo test --all --all-features --manifest-path=Ishiiruka/Externals/SlippiRustExtensions/Cargo.toml
      - name: "(sats-arena) Run cargo test"
        run: cargo test --workspace --manifest-path=sats-arena/Cargo.toml
      - name: "Build Arena Dolphin"
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S Ishiiruka -B Ishiiruka/build-arena -G Ninja \
            -DLINUX_LOCAL_DEV=ON -DENABLE_SATS_ARENA=ON -DENABLE_LLVM=OFF \
            -DDISTRIBUTOR="Sats Arena preview" -DCMAKE_BUILD_TYPE=Release
          cmake --build Ishiiruka/build-arena --target dolphin-emu --target sats-arena-wallet-check --parallel "$(nproc)"
          cp -a Ishiiruka/Data/Sys Ishiiruka/build-arena/Binaries/
      - name: "Package native bundle"
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          B=Ishiiruka/build-arena/Binaries
          L=Ishiiruka/build-arena/Source/Core/DolphinWX
          mkdir -p artifact/native/lib
          cp "$B/dolphin-emu" "$B/sats-arena-wallet-check" artifact/native/
          cp -a "$B/Sys" artifact/native/Sys
          cp Ishiiruka/Tools/arena/alsa-pulse.conf artifact/native/
          cp "$L/libsats_arena_local.so" "$L/libslippi_rust_extensions.so" artifact/native/lib/
          chmod +x artifact/native/dolphin-emu artifact/native/sats-arena-wallet-check
          FILE_NAME=${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-linux-arena.zip
          cd artifact && zip -r "${FILE_NAME}" native
      - name: "Build SteamOS-compatible AppImage"
        if: success()
        working-directory: ${{ github.workspace }}/Ishiiruka
        run: |
          export NO_STRIP=on
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O Tools/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -O Tools/linuxdeploy-plugin-appimage
          chmod +x Tools/linuxdeploy Tools/linuxdeploy-plugin-appimage
          rm -rf ./AppDir/
          mkdir -p AppDir/apprun-hooks
          cp Data/linux-env.sh AppDir/apprun-hooks/
          # linuxdeploy bundles every shared-library dependency (gtk, webkit, etc.)
          # so the result runs on SteamOS's read-only rootfs.
          ./Tools/linuxdeploy --appdir=./AppDir \
            -e ./build-arena/Binaries/dolphin-emu \
            -e ./build-arena/Binaries/sats-arena-wallet-check \
            -d ./Data/slippi-online.desktop \
            -i ./Data/dolphin-emu.png
          cp -r build-arena/Binaries/Sys AppDir/usr/bin/
          cp Tools/arena/alsa-pulse.conf AppDir/usr/bin/
          cp build-arena/Source/Core/DolphinWX/libsats_arena_local.so AppDir/usr/lib/
          cp build-arena/Source/Core/DolphinWX/libslippi_rust_extensions.so AppDir/usr/lib/
          # known conflicts/crashes on modern distros
          rm -f AppDir/usr/lib/libgmodule* AppDir/usr/lib/librsvg-2.so.2
          OUTPUT=Sats-Arena-x86_64.AppImage ./Tools/linuxdeploy-plugin-appimage --appdir=./AppDir/
          mv Sats-Arena-x86_64.AppImage ../artifact/
      - name: "Publish"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arena
          path: "./artifact/"

  macOS:
    needs: [skip_duplicates]
    if: ${{ needs.skip_duplicates.outputs.should_skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Netplay, Playback]
        include:
          - build_type: Netplay
            artifact_name: macOS-netplay
            build_config: netplay
          - build_type: Playback
            artifact_name: macOS-playback
            build_config: playback
    name: "macOS ${{ matrix.build_type }}"
    # Intel build, same as upstream Slippi; Apple Silicon runs it under Rosetta 2.
    runs-on: macos-15-intel
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
        with:
          submodules: recursive
          path: Ishiiruka
      - name: "Checkout sats-arena"
        uses: actions/checkout@v3
        with:
          repository: sats-melee/sats-arena
          path: sats-arena
      - name: 'Fetch Git Tags'
        if: success()
        working-directory: ${{ github.workspace }}/Ishiiruka
        run: |
          git fetch --prune --unshallow
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "CURR_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: "Download and Install prerequisites"
        if: success()
        shell: bash
        run: |
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          brew install \
          libpng \
          pkgconfig \
          libao \
          sound-touch \
          hidapi \
          python@3.10
          # Pin CMake 3.31.7 (official universal binary; newer CMake rejects this tree)
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.7/cmake-3.31.7-macos-universal.tar.gz -o /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /opt
          echo "/opt/cmake-3.31.7-macos-universal/CMake.app/Contents/bin" >> $GITHUB_PATH
      - id: rust_ver
        name: Grab Rust Version
        shell: bash
        run: echo "rust_ver=$(sed -rn 's/^channel = "(.*)"/\1/p' ./Ishiiruka/Externals/SlippiRustExtensions/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: "Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust_ver.outputs.rust_ver }}  # Pin to our specific Rust version.
          rustflags: ""  # Disable default injection of warnings = errors.
      - name: "(SlippiRustExtensions) Run cargo test"
        run: cargo test --all --all-features --manifest-path=Ishiiruka/Externals/SlippiRustExtensions/Cargo.toml
      - name: "Build ${{ matrix.build_type }} Dolphin"
        if: success()
        shell: bash
        working-directory: ${{ github.workspace }}/Ishiiruka
        run: |
          export LIBRARY_PATH="$LIBRARY_PATH:$(brew --prefix)/lib"
          chmod +x ./build-mac.sh && ./build-mac.sh ${{ matrix.build_config }}
          mkdir artifact
          FILE_NAME=${{ env.CURR_DATE }}-${{ env.GIT_HASH }}-${{ env.GIT_TAG }}-${{ matrix.artifact_name }}
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
      - name: "Bundle Rust dylibs and ad-hoc sign"
        if: success()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          APP="Ishiiruka/build/Binaries/Slippi Dolphin.app"
          BIN="$APP/Contents/MacOS/Slippi Dolphin"
          mkdir -p "$APP/Contents/Frameworks"
          # Ship the wallet check tool inside the bundle (Makefile builds put it in Binaries)
          cp Ishiiruka/build/Binaries/sats-arena-wallet-check "$APP/Contents/MacOS/"
          for lib in \
            sats-arena/target/release/libsats_arena_local.dylib \
            Ishiiruka/Externals/SlippiRustExtensions/target/release/libslippi_rust_extensions.dylib; do
            [ -f "$lib" ] && cp "$lib" "$APP/Contents/Frameworks/"
          done
          for exe in "$BIN" "$APP/Contents/MacOS/sats-arena-wallet-check"; do
            [ -f "$exe" ] || continue
            install_name_tool -add_rpath @executable_path/../Frameworks "$exe" 2>/dev/null || true
            for name in libsats_arena_local libslippi_rust_extensions; do
              old=$(otool -L "$exe" | grep "$name.dylib" | awk '{print $1}' | head -1)
              if [ -n "$old" ] && [ "$old" != "@rpath/$name.dylib" ]; then
                install_name_tool -change "$old" "@rpath/$name.dylib" "$exe"
              fi
            done
          done
          for dylib in "$APP/Contents/Frameworks/"*.dylib; do
            [ -f "$dylib" ] || continue
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib"
          done
          # Apple Silicon refuses to run unsigned code from quarantined archives; ad-hoc sign everything
          codesign --force --deep --sign - "$APP"
      - name: "Package ${{ matrix.build_type }} Release DMG"
        if: success()
        shell: bash
        working-directory: ${{ github.workspace }}/Ishiiruka
        run: |
          rm build/Binaries/traversal_server
          chmod +x Tools/create-dmg/run.sh
          ./Tools/create-dmg/run.sh --no-internet-enable \
            --volname "Slippi Dolphin Installer" \
            --volicon "Data/slippi_dmg_icon.icns" \
            --background "Data/slippi_dmg_background.png" \
            --text-size 14 \
            --window-pos 200 120 \
            --window-size 590 610 \
            --icon-size 100 \
            --app-drop-link 440 196 \
            --icon "Slippi Dolphin.app" 140 196 \
            --hide-extension "Slippi Dolphin.app" \
            "${{ env.FILE_NAME }}.dmg" \
            "./build/Binaries/"
          mv "${{ env.FILE_NAME }}.dmg" artifact/
      - name: "Publish"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "./Ishiiruka/artifact/"
